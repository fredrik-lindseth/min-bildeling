    <rect x="10" y="4" width="2" height="3"/>
    <rect x="2" y="8" width="12" height="3" rx="1"/>
  </g>
  <g fill="#2B1260" stroke="#C9B6F5" stroke-width="2" paint-order="stroke">
    <circle cx="4.5" cy="12.5" r="1.5"/>
    <circle cx="11.5" cy="12.5" r="1.5"/>
  </g>
</svg>
