<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!-- Promobildet til Chrome Web Store, 440x280. Fargene er bakgrunn, tekst,
       sekundærtekst og aksent i lys modus fra lib/tokens.css. Ikonet er det
       samme som icons/icon.svg. -->
  <rect width="440" height="280" fill="#ECEAE6"/>
  <svg x="40" y="48" width="80" height="80" viewBox="0 0 16 16">
    <rect width="16" height="16" rx="3.5" fill="#51289D"/>
    <g fill="#FFFFFF">
      <rect x="4" y="5" width="2" height="2"/>
      <rect x="7" y="2" width="2" height="5"/>
      <rect x="10" y="4" width="2" height="3"/>
      <rect x="2" y="8" width="12" height="3" rx="1"/>
    </g>
    <g fill="#FFFFFF" stroke="#51289D" stroke-width="2" paint-order="stroke">
      <circle cx="4.5" cy="12.5" r="1.5"/>
      <circle cx="11.5" cy="12.5" r="1.5"/>
    </g>
  </svg>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="184" font-size="34" font-weight="700" fill="#1E1C19">Bildeleringen Stats</text>
    <text x="40" y="218" font-size="17" fill="#57524B">Statistikk over bildelingen din på dele.no</text>
  </g>
</svg>
