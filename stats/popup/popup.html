<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min bildeling</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="body">
    <h1 class="visually-hidden">Min bildeling</h1>
    <div id="status" class="status" role="status" hidden>
      <div class="status__text" id="status-text"></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Fremdrift for synkronisering" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress__bar" id="progress-bar"></div>
      </div>
    </div>

    <section id="stats-section" class="stats" aria-label="Denne måneden" hidden>
      <p class="lead">
        <span class="lead__number" id="spend-this-month">–</span>
        <span class="lead__text">denne måneden, <span id="trips-this-month">–</span>. Forrige måned <span id="spend-last-month">–</span>.</span>
      </p>

      <dl class="figures">
        <div><dt>Snittpris per tur</dt><dd id="avg-cost">–</dd></div>
        <div><dt>Mest brukte bil</dt><dd id="most-used-car">–</dd></div>
        <div><dt>Spart i år</dt><dd id="yearly-savings">–</dd></div>
      </dl>
      <p class="history-note" id="history-note" hidden></p>
      <a class="method-link" id="savings-method" href="#">Slik beregnes det</a>

      <div class="months">
        <h2 class="months__label" id="months-label">Siste 6 måneder, kr</h2>
        <div class="months__frame">
          <canvas id="months-chart" role="img" aria-label="Siste 6 måneder"></canvas>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="last-synced" class="footer__sync-time"></span>
    <button id="sync-btn" class="btn btn--sync" type="button">Synkroniser</button>
    <button id="dashboard-link" class="btn btn--primary" type="button">Åpne dashboard</button>
  </footer>

  <script src="../vendor/chart.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
